apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-cart-pv
spec:
  capacity:
    storage: 2Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: local-storage

  local:
    path: /var/lib/k8s-local-storage/redis-cart

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-01
                
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cart
  labels:
    app: redis-cart

spec:
  serviceName: redis-cart
  replicas: 1

  selector:
    matchLabels:
      app: redis-cart

  template:
    metadata:
      labels:
        app: redis-cart

    spec:
      automountServiceAccountToken: false

      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:
      - name: redis

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true

        image: redis

        ports:
        - containerPort: 6379

        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: 6379

        livenessProbe:
          periodSeconds: 5
          tcpSocket:
            port: 6379

        volumeMounts:
        - mountPath: /data
          name: redis-data

      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: emailservice
    literals:
      - PORT=8080
      - DISABLE_PROFILER=1

generatorOptions:
  disableNameSuffixHash: true


resources:
- emailservice-dpl.yaml
- emailservice-svc.yaml
- emailservice-ingress-netpol.yaml

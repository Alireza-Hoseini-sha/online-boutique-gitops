apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: productcatalogservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice
    newTag: v0.10.6

configMapGenerator:
  - name: productcatalogservice
    literals:
    - PORT=3550
    - DISABLE_PROFILER=1

generatorOptions:
  disableNameSuffixHash: true

resources:
- productcatalogservice-dpl.yaml
- productcatalogservice-svc.yaml
- productcatalogservice-ingress-netpol.yaml


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: shippingservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice
    newTag: v0.10.6

configMapGenerator:
  - name: shippingservice
    literals:
    - PORT=50051
    - DISABLE_PROFILER=1

generatorOptions:
  disableNameSuffixHash: true

resources:
- shippingservice-dpl.yaml
- shippingservice-svc.yaml
- shippingservice-ingress-netpol.yaml


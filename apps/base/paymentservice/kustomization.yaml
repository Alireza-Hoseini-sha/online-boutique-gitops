apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: paymentservice
    newName: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newTag: v0.10.6

configMapGenerator:
  - name: paymentservice
    literals:
    - PORT=50051
    - DISABLE_PROFILER=1

generatorOptions:
  disableNameSuffixHash: true

resources:
- paymentservice-dpl.yaml
- paymentservice-svc.yaml
- paymentservice-sa.yaml
- paymentservice-ingress-netpol.yaml
- paymentservice-roleBinding.yaml
- paymentservice-role.yaml
- paymentservice-secret.yaml
